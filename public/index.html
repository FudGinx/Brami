<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Брами та дворики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: тепла сімейна настільна гра — ранок у старому дворику
   IDEA: стіл реставратора: велика крамниця-полиця, відкриті замовлення, три фасади
   PICTURE: великі двері, що збираються шарами на тлі стін українських міст
   COLOUR and TYPE: каштанова зелень столу, вапняк, латунь; Alegreya + Golos Text
   LAYOUT: смуга гравців; крамниця на всю ширину; альбом з трьома великими стінами; липка панель ходу */
:root{color-scheme:light dark;--table:#1c362f;--paper:#fbf7ee;--ink:#2a241d;--cream:#f3ecdc;--mute:#b9c7bf;--brass:#d6a640;--wood:#6b4a2e;--wood2:#553923;--ok:#5fd08a;--bad:#e0645a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;color:var(--cream);font:15px/1.4 "Golos Text",system-ui,sans-serif;overflow-x:clip}
body{background:radial-gradient(1200px 600px at 20% -10%,#2f5a4e 0,transparent 60%),var(--table);min-height:100vh}
button{font:inherit;color:inherit}
.ic{width:22px;height:22px;flex:none;vertical-align:middle}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(0,0,0,.25);border-bottom:2px solid var(--brass);flex-wrap:wrap}
.logo{font:800 24px/1 Alegreya,Georgia,serif;margin-right:6px;white-space:nowrap}
.seats{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.seat{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:999px;background:rgba(255,255,255,.07);border:2px solid transparent;cursor:pointer;min-height:42px}
.seat.cur{border-color:var(--brass);background:rgba(214,166,64,.16)}
.seat.view{box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.ava{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#1c1c1c;flex:none}.ava .ic{width:18px;height:18px}
.sn{font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-weight:800;color:var(--brass);display:flex;align-items:center;gap:2px}.sc .ic{width:15px;height:15px}
.dd{display:flex;gap:2px}.dd i{width:8px;height:11px;border-radius:4px 4px 0 0;background:rgba(255,255,255,.2)}.dd i.on{background:var(--brass)}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);display:grid;place-items:center;cursor:pointer}
.ibtn:focus-visible,.btn:focus-visible,.card:focus-visible,.ocard:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:14px 14px 0}
.panel{background:rgba(0,0,0,.18);border-radius:20px;padding:14px;margin-bottom:14px}
.ptitle{display:flex;align-items:center;gap:10px;font:800 20px Alegreya,Georgia,serif;margin:0 0 12px;flex-wrap:wrap}
.ptitle .meta{font:600 13px "Golos Text";color:var(--mute);display:flex;gap:12px;margin-left:auto;align-items:center}
.ptitle .meta span{display:flex;align-items:center;gap:4px}.ptitle .meta .ic{width:17px;height:17px}
.shop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:14px}
@media(max-width:1000px){.shop{grid-template-columns:minmax(0,1fr)}}
.shelf{background:linear-gradient(var(--wood),var(--wood2));border-radius:16px;padding:12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;box-shadow:inset 0 -7px 0 rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.3)}
@media(max-width:520px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:8px}}
.card{position:relative;aspect-ratio:3/4.3;background:var(--paper);color:var(--ink);border-radius:11px;box-shadow:0 2px 0 rgba(0,0,0,.25),0 5px 12px rgba(0,0,0,.28);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card .top{position:absolute;left:0;right:0;top:0;height:21px;background:var(--c);color:#fff;display:flex;align-items:center;gap:4px;padding:0 6px;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden}
.card .top .ic{width:14px;height:14px}
.card svg.part{position:absolute;left:7%;top:23px;width:86%;height:calc(100% - 50px)}
.card .lab{position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;align-items:center;gap:4px;padding:0 6px;font-size:12px;font-weight:700;border-top:1px solid #e6dcc8;white-space:nowrap;overflow:hidden}
.card .lab .ic{width:16px;height:16px}
.card.fit{box-shadow:0 0 0 3px var(--ok),0 5px 12px rgba(0,0,0,.28)}
.card.perfect{box-shadow:0 0 0 4px var(--brass),0 0 18px 4px rgba(214,166,64,.7)}
.card.perfect::after{content:"★";position:absolute;right:5px;top:24px;width:22px;height:22px;border-radius:50%;background:var(--brass);color:#2a241d;display:grid;place-items:center;font-size:13px;font-weight:800}
.card.sel{transform:translateY(-6px)}
.card.will{transform:translateY(-6px) scale(1.04);box-shadow:0 0 0 4px #fff,0 0 20px rgba(255,255,255,.6)}
.card.lift{opacity:.25}.card.off{cursor:default}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(-4deg) scale(1.08);box-shadow:0 16px 30px rgba(0,0,0,.5)!important}
.side{display:flex;flex-direction:column;gap:12px}
.omkt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ocard{background:var(--paper);color:var(--ink);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3);position:relative;touch-action:none}
.ocard svg.ws{display:block;width:100%;height:auto}
.ocard .on{padding:5px 7px 7px;font-size:12px;font-weight:700;line-height:1.2}
.chips{display:flex;gap:2px;margin-top:4px;width:100%}.chips i{flex:1;height:7px;border-radius:2px;display:block}
.ocard.ok{box-shadow:0 0 0 3px var(--brass),0 4px 10px rgba(0,0,0,.3)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:72px;border-radius:14px;border:2px dashed rgba(255,255,255,.28);background:rgba(255,255,255,.05);cursor:pointer;font-weight:700;padding:6px;text-align:center}
.tool b{display:flex;align-items:center;gap:6px;font-size:16px}.tool b .ic{width:26px;height:26px}.tool small{font-weight:400;color:var(--mute);font-size:12px}
.tool[disabled]{opacity:.35;cursor:default}
.tool.ok{border-color:var(--brass);border-style:solid;background:rgba(214,166,64,.15)}.tool.hot{background:rgba(214,166,64,.4)}
.walls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:820px){.walls{grid-template-columns:minmax(0,1fr)}}
.door{display:flex;flex-direction:column;gap:8px}
.wall{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.38);cursor:pointer}
.wall svg.ws{display:block;width:100%;height:auto}
.wall.ok{outline:4px solid var(--brass);outline-offset:-4px}
.wall.hot{outline-width:7px}
.wall.thump{animation:thump .55s}
@keyframes thump{30%{transform:scale(1.03)}60%{transform:scale(.99)}}
.badge{position:absolute;right:10px;top:10px;background:var(--brass);color:#2a241d;border-radius:999px;padding:4px 11px;font-weight:800;display:flex;align-items:center;gap:3px;font-size:16px}.badge .ic{width:16px;height:16px}
.otitle{font:800 16px/1.15 Alegreya,serif;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.otitle small{font:600 12px "Golos Text";color:var(--mute);white-space:nowrap}
.strip{background:rgba(255,255,255,.06);border-radius:12px;padding:4px}
.lr{display:grid;grid-template-columns:26px minmax(0,1fr) auto 22px;gap:6px;align-items:center;padding:5px 6px;border-radius:8px;font-size:13.5px}
.lr .ic{width:20px;height:20px}
.lr .nm{font-weight:600}
.lr .need{display:flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px 2px 3px;font-size:12px;font-weight:700;color:#fff;background:var(--c);white-space:nowrap}
.lr .need .ic{width:14px;height:14px}
.lr .st{font-weight:800;text-align:center}
.lr.now{background:rgba(214,166,64,.22);box-shadow:inset 3px 0 0 var(--brass)}
.lr.done .nm{opacity:.75}
.lr.ok{outline:2px solid var(--brass)}.lr.hot{background:rgba(214,166,64,.45)}
.st.y{color:var(--ok)}.st.n{color:#f0b35a}
.emptyhint{padding:10px;font-size:14px;color:var(--mute);text-align:center}
.lower{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;margin-top:14px;align-items:start}
@media(max-width:820px){.lower{grid-template-columns:minmax(0,1fr)}}
.tray{position:relative;background:linear-gradient(#e7dcc5,#d8c9ab);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;box-shadow:inset 0 3px 8px rgba(0,0,0,.25)}
@media(max-width:700px){.tray{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cell{aspect-ratio:3/4.3;border-radius:11px;border:2px dashed rgba(90,70,40,.3)}
.dock{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);width:min(920px,94vw);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;z-index:45;animation:dockin .2s}
@keyframes dockin{from{transform:translate(-50%,30px);opacity:0}}
.dock .zone{min-height:118px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.zone{border-radius:14px;background:rgba(28,54,47,.9);border:3px dashed var(--brass);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--cream);text-align:center}
.zone b{display:flex;align-items:center;gap:8px;font:800 26px Alegreya,serif}.zone b .ic{width:30px;height:30px}.zone small{font-size:13px}
.zone.hot{background:rgba(214,166,64,.95);color:#2a241d;border-style:solid}
.zone.full{background:rgba(120,30,25,.9);border-color:var(--bad)}
.handw{display:flex;flex-direction:column;gap:6px}
.handw .lbl{font-size:13px;color:var(--mute);font-weight:600}
.hand{display:flex;gap:8px;min-height:60px;border-radius:12px;padding:4px}
.hand.ok{outline:3px dashed var(--brass)}.hand.hot{background:rgba(214,166,64,.3)}
.hand .ocard{width:118px}
.turn{position:sticky;bottom:0;z-index:6;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:rgba(16,32,28,.96);border-top:2px solid var(--brass);margin:0 -14px;backdrop-filter:blur(6px)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.07);font-weight:700;font-size:14px;opacity:.55}
.step.on{opacity:1;background:rgba(214,166,64,.22);box-shadow:inset 0 0 0 2px var(--brass)}.step.done{opacity:.9}.step .ic{width:18px;height:18px}
.hint{flex:1;font-size:14px;color:var(--mute);min-width:200px}
.hint.warn{color:#ffd6a0;font-weight:600}
.btn{min-height:46px;border-radius:12px;border:0;padding:10px 18px;font-weight:700;background:var(--brass);color:#2a241d;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.alt{background:rgba(255,255,255,.1);color:var(--cream);border:1px solid rgba(255,255,255,.25)}
.btn[disabled]{opacity:.35;cursor:default}
#modal{position:fixed;inset:0;background:rgba(8,14,12,.62);display:flex;align-items:center;justify-content:center;z-index:40;padding:12px}
.mbox{background:var(--paper);color:var(--ink);max-width:600px;width:100%;max-height:92vh;overflow:auto;border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h2{font:800 26px/1.1 Alegreya,Georgia,serif;margin:0 0 10px}
.mbox .btn.alt{color:var(--ink);background:#ece3cf;border-color:#d8cbb0}
.mbox .strip{background:#efe6d2}.mbox .lr{color:var(--ink)}
.hidden{display:none!important}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.choice{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:14px;background:#efe6d2;border:2px solid transparent;cursor:pointer;font-weight:800;font-size:20px;text-align:center}
.choice:hover{border-color:var(--brass)}.choice .ic{width:34px;height:34px}.choice small{font:400 13px "Golos Text";color:#6b5f50}
.choice.dis{opacity:.4;cursor:not-allowed}
.choice svg.ws{width:120px;border-radius:10px}
.pcin{animation:flip .8s cubic-bezier(.3,.7,.2,1)}@keyframes flip{from{transform:perspective(900px) rotateY(-100deg);opacity:.2}}
.fact{background:#efe4cc;border-radius:12px;padding:10px 12px}
.big svg.ws{width:240px;max-width:80%;display:block;margin:0 auto 10px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.sline{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sline span{background:#efe4cc;border-radius:999px;padding:4px 10px;font-weight:700;display:flex;gap:4px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:7px 5px;border-bottom:1px solid #e0d4bc;text-align:left}td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.float{position:fixed;z-index:60;pointer-events:none;font:800 26px Alegreya,serif;color:var(--brass);text-shadow:0 2px 6px rgba(0,0,0,.6);animation:up 1.2s forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#14241f;color:#fff;padding:11px 18px;border-radius:14px;z-index:70;font-weight:600;border:1px solid var(--brass);max-width:92vw;text-align:center}
.toast.warn{border-color:var(--bad);background:#3a1714}
.lobby{max-width:1100px;margin:0 auto;padding:16px}
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:8px 0 18px}
.hero .wall{cursor:default}
.lgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media(max-width:760px){.lgrid{grid-template-columns:minmax(0,1fr)}}
.lrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.inp{flex:1;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:var(--cream);font:16px "Golos Text"}
.kind{display:flex;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.kind button{width:46px;height:46px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--mute)}.kind button.on{background:var(--brass);color:#2a241d}
.code{font:800 34px/1 Alegreya,serif;letter-spacing:4px;color:var(--brass)}
.waitb{font-size:13px;color:var(--mute)}
.plq{display:inline-block;background:#24508f;color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;border:1px solid #fff;box-shadow:0 0 0 1px #24508f}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:16px;height:12px;border-radius:3px;display:inline-block}
@media(max-width:600px){.logo{font-size:18px}.sn,.dd{display:none}.seat{padding-right:8px}.wrap{padding:8px 8px 0}.panel{padding:10px}.turn{margin:0 -8px}.hint{min-width:0;flex-basis:100%;order:3}}
@media(min-width:900px) and (min-height:560px){
 body.ingame{height:100vh;overflow:hidden}
 .game{height:calc(100vh - 66px);display:grid;grid-template-columns:minmax(0,37fr) minmax(0,63fr);grid-template-rows:minmax(0,1fr) auto;gap:10px;padding:10px;max-width:none}
 .game>.panel{margin:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:10px}
 .game .ptitle{margin-bottom:8px;font-size:18px}
 .game>.turn{grid-column:1/-1;position:static;margin:0;border-radius:14px;padding:8px 12px}
 .game .shop{grid-template-columns:minmax(0,1fr);gap:10px;min-height:0;flex:1;align-content:start}
 .game .shelf{padding:8px;gap:7px}
 .game .card .top{height:18px;font-size:10.5px}.game .card svg.part{top:20px;height:calc(100% - 44px)}.game .card .lab{height:23px;font-size:11px}
 .game .legend{margin-top:5px;font-size:11.5px}
 .game .side{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:8px;align-items:start}
 .game .side .ptitle{font-size:14px!important}.game .side .ptitle .meta{font-size:11px}
 .game .omkt{gap:6px}.game .ocard .on{font-size:11px;padding:4px 5px 5px}
 .game .tools{grid-template-columns:1fr;gap:6px;margin-top:22px}
 .game .tool{min-height:0;padding:6px 4px}.game .tool small{font-size:10.5px}.game .tool b .ic{width:22px;height:22px}
 .game .walls{flex:1;min-height:0;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
 .game .door{min-height:0;gap:5px}
 .game .otitle{font-size:14px}
 .game .wall{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;background:none;box-shadow:none;overflow:visible;border-radius:0}
 .game .wall svg.ws{height:100%;width:auto;max-width:100%;border-radius:14px;box-shadow:0 8px 18px rgba(0,0,0,.38)}
 .game .wall.ok{outline:none}.game .wall.ok svg.ws{outline:4px solid var(--brass);outline-offset:-4px}.game .wall.hot svg.ws{outline-width:7px}
 .game .badge{right:auto;left:50%;transform:translateX(-50%);top:6px}
 .game .strip{padding:2px}.game .lr{padding:2px 5px;font-size:12px;gap:5px;grid-template-columns:20px minmax(0,1fr) auto 16px}.game .lr .ic{width:16px;height:16px}.game .lr .need{font-size:11px;padding:1px 7px 1px 2px}.game .lr .need .ic{width:12px;height:12px}
 .game .emptyhint{padding:6px;font-size:12.5px}
 .game .lower{margin-top:8px;gap:10px}
 .game .lower .ptitle{font-size:14px!important;margin-bottom:5px!important}
 .game .tray{padding:6px;gap:6px}
 .game .hand{min-height:0;padding:0;gap:6px}.game .hand .ocard{width:74px}.game .hand .ocard .on{font-size:9.5px;padding:3px 4px 4px}
}
@media(min-width:900px) and (max-height:760px) and (min-height:560px){
 .game .legend{display:none}.game .otitle small{display:none}.game .ptitle .meta{font-size:11px}
 .game .tray{grid-template-columns:repeat(8,minmax(0,62px))}.game .hand .ocard{width:62px}
}
/* замовлення: відкриті — малі зі збільшенням при наведенні, у руці — великі */
.omkt{grid-template-columns:repeat(3,minmax(0,96px))}
.omkt .ocard{transition:transform .18s ease,box-shadow .18s;transform-origin:top center;position:relative}
.omkt .ocard:first-child{transform-origin:top left}.omkt .ocard:last-child{transform-origin:top right}
.omkt .ocard:hover,.omkt .ocard:focus-visible{transform:scale(2);z-index:30;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.hand .ocard{width:140px}
@media(min-width:900px) and (min-height:560px){
 .game>.panel:first-child{overflow:visible;position:relative;z-index:5}
 .game .omkt{grid-template-columns:repeat(3,minmax(0,78px))}
 .game .omkt .ocard:hover,.game .omkt .ocard:focus-visible{transform:scale(2.3)}
 .game .hand .ocard{width:108px}.game .hand .ocard .on{font-size:11.5px;padding:4px 6px 6px}
}
@media(min-width:900px) and (max-height:760px) and (min-height:560px){.game .hand .ocard{width:96px}}
.verd{text-align:center;margin:-4px 0 12px}
.verd b{display:block;font:800 30px/1.1 Alegreya,serif;color:#7a5a12}
.verd.v5 b{color:#b8860b;font-size:36px;text-shadow:0 2px 0 #f3dc9a}
.verd.v4 b{color:#a06a12}.verd.v0 b,.verd.v1 b,.verd.v2 b{color:#6b5f50}
.verd small{display:block;color:#6b5f50;font-size:14px;margin-top:4px}
.vst{display:flex;justify-content:center;gap:4px;margin-bottom:6px}
.vst span{color:#d8ccb4}.vst span .ic{width:30px;height:30px}

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

 g.pl.forEach(p=>{if(g.od.length)p.hand.push(g.od.pop());});refillO(g);refillM(g);return g;}

function refillM(g){while(g.market.length<MK){const c=drawP(g);if(c==null)break;g.market.push(c);}}
function refillO(g){while(g.om.length<OM&&Array.isArray(g.od)&&g.od.length)g.om.push(g.od.pop());}
function takeSet(g,pid,mode){const p=PT(pid);return g.market.filter(id=>mode==="s"?PT(id).s===p.s:PT(id).t===p.t);}
const free=(g,seat)=>STMAX-g.pl[seat].st.length;
function targets(g,seat,pid){const P=g.pl[seat],p=PT(pid),res=[];
 P.doors.forEach((d,i)=>{if(!d){if(p.t==="base")res.push({slot:i,layer:0});return;}if(isDone(d))return;const n=nextIdx(d);
  if(ACC[n].includes(p.t))res.push({slot:i,layer:n});for(let k=0;k<n;k++)if(ACC[k].includes(p.t))res.push({slot:i,layer:k,rep:true});});return res;}
function doorScore(d){if(!isDone(d))return 0;let s=0,m=0;d.L.forEach((id,i)=>{s++;if(d.o>=0&&PT(id).s===ORD[d.o].req[i]){s++;m++;}});return s+(m===5?3:0);}

function score(g,i){const P=g.pl[i];return P.doors.reduce((a,d)=>a+doorScore(d),0)+P.work-P.brak-(g.over?P.st.length:0);}
function apply(g,seat,m){if(!g||g.over||seat!==g.cur||!m)return false;const P=g.pl[seat];
 switch(m.a){
 case "order":{if(g.otook||P.hand.length>=HMAX||!g.om.includes(m.o))return false;g.om.splice(g.om.indexOf(m.o),1);P.hand.push(m.o);refillO(g);g.otook=true;g.fx={k:"order",o:m.o,seat};return true;}
 case "mdisc":{if(g.phase!=="take"||g.mdisc)return false;const i=g.market.indexOf(m.pid);if(i<0)return false;g.market.splice(i,1);g.disc.push(m.pid);const r0=g.rs;refillM(g);g.mdisc=true;g.phase="place";g.fx={k:"mdisc",pid:m.pid,rs:g.rs>r0};return true;}
 case "take":{if(g.phase!=="take"||!g.market.includes(m.pid)||(m.mode!=="s"&&m.mode!=="t"))return false;const ids=takeSet(g,m.pid,m.mode);if(ids.length>free(g,seat))return false;
  g.market=g.market.filter(id=>!ids.includes(id));P.st.push(...ids);const r0=g.rs;refillM(g);g.phase="place";g.fx={k:"take",ids,seat,rs:g.rs>r0};return true;}
 case "work":{if(g.phase!=="take")return false;P.work++;g.phase="place";g.fx={k:"work",seat};return true;}
 case "sdisc":{const i=P.st.indexOf(m.pid);if(i<0)return false;P.st.splice(i,1);g.disc.push(m.pid);P.brak++;g.fx={k:"sdisc",pid:m.pid,seat};return true;}
 case "place":{if(g.phase!=="place"||g.placed>=2||!P.st.includes(m.pid))return false;
  const t=targets(g,seat,m.pid).find(x=>x.slot===m.slot&&(m.layer==null?!x.rep:x.layer===m.layer));if(!t)return false;
  let d=P.doors[m.slot];if(!d){let o=-1;if(P.hand.length){o=P.hand.includes(m.o)?m.o:P.hand[0];P.hand.splice(P.hand.indexOf(o),1);}d=P.doors[m.slot]={o,L:[null,null,null,null,null]};}
  const old=d.L[t.layer];if(old!=null)g.disc.push(old);d.L[t.layer]=m.pid;P.st.splice(P.st.indexOf(m.pid),1);g.placed++;
  g.fx={k:"place",pid:m.pid,seat,slot:m.slot,layer:t.layer,rep:old!=null};
  if(isDone(d)){g.fx.done=true;g.fx.pts=doorScore(d);if(g.endBy<0&&P.doors.every(isDone)){g.endBy=seat;g.left=g.seats.length-1;}}return true;}
 case "end":{if(g.phase!=="place")return false;const n=g.seats.length;
  if(!g.market.length&&!cnt(g.deck)&&!cnt(g.disc)){g.over=true;g.fx={k:"over"};return true;}
  if(g.endBy>=0){if(!g.trig&&g.cur===g.endBy){g.trig=true;if(g.left<=0){g.over=true;g.fx={k:"over"};return true;}}else{g.left--;if(g.left<=0){g.over=true;g.fx={k:"over"};return true;}}}
  g.cur=(g.cur+1)%n;if(g.cur===0){g.round++;if(g.round>30){g.over=true;g.fx={k:"over"};return true;}}g.phase="take";g.placed=0;g.mdisc=false;g.otook=false;g.fx={k:"turn"};return true;}}
 return false;}

function hintMarket(g,seat,pid){const P=g.pl[seat],p=PT(pid);let r="";
 for(const d of P.doors){if(!d){if(p.t==="base"){r=r||"fit";if(P.hand.some(o=>ORD[o].req[0]===p.s))return "perfect";}continue;}if(isDone(d))continue;const n=nextIdx(d);
  for(let k=n;k<5;k++)if(ACC[k].includes(p.t)){r=r||"fit";if(reqOf(d,k)===p.s)return "perfect";}}return r;}
function hintStore(g,seat,pid){const T=targets(g,seat,pid).filter(t=>!t.rep);if(!T.length)return "";const P=g.pl[seat],p=PT(pid);
 for(const t of T){const d=P.doors[t.slot];if(!d){if(P.hand.some(o=>ORD[o].req[0]===p.s))return "perfect";}else if(reqOf(d,t.layer)===p.s)return "perfect";}return "fit";}

/* ================= БОТ ================= */
function useVal(g,P,id,have){const p=PT(id);let best=-0.7;
 P.doors.forEach(d=>{if(!d){if(p.t==="base"){const ok=P.hand.some(o=>ORD[o].req[0]===p.s),al=have.some(h=>PT(h).t==="base");best=Math.max(best,al?0.1:(ok?3:1.6));}return;}if(isDone(d))return;const n=nextIdx(d);
  for(let k=n;k<5;k++){if(!ACC[k].includes(p.t))continue;const req=reqOf(d,k);const al=have.some(h=>{const q=PT(h);return ACC[k].includes(q.t)&&(!req||q.s===req);});let v=req===p.s?3:1;if(k>n)v*=.8;if(al)v*=.3;best=Math.max(best,v);}
  for(let k=0;k<n;k++)if(ACC[k].includes(p.t)&&d.o>=0&&PT(d.L[k]).s!==ORD[d.o].req[k]&&p.s===ORD[d.o].req[k])best=Math.max(best,1.5);});return best;}
function botOrder(g,seat){const P=g.pl[seat];if(g.otook||P.hand.length>=2||!g.om.length)return null;const empty=P.doors.some(d=>!d);if(!empty)return null;
 let best=g.om[0],bv=-1;for(const o of g.om){let v=0;ORD[o].req.forEach((s,k)=>{if(P.st.some(id=>PT(id).s===s&&ACC[k].includes(PT(id).t)))v++;});if(v>bv){bv=v;best=o;}}return {a:"order",o:best};}
function botTake(g,seat){const P=g.pl[seat];let best={a:"work"},bv=0.9;const seen=new Set(),fr=free(g,seat);
 for(const pid of g.market)for(const mode of ["s","t"]){const p=PT(pid),key=mode+(mode==="s"?p.s:p.t);if(seen.has(key))continue;seen.add(key);
  const ids=takeSet(g,pid,mode);if(ids.length>fr)continue;let v=0;const tmp=P.st.slice();ids.forEach(id=>{v+=useVal(g,P,id,tmp);tmp.push(id);});if(v>bv){bv=v;best={a:"take",pid,mode};}}
 return best;}
function botPlace(g,seat){const P=g.pl[seat];let best=null,bv=0;
 for(const pid of P.st)for(const t of targets(g,seat,pid)){const d=P.doors[t.slot],p=PT(pid);let v,mv;
  if(!d){const o=P.hand.find(o=>ORD[o].req[0]===p.s);v=o!=null?3:1.2;mv={a:"place",pid,slot:t.slot,o:o!=null?o:P.hand[0]};}
  else{const req=reqOf(d,t.layer);v=t.rep?((req&&PT(d.L[t.layer]).s!==req&&p.s===req)?2.5:-1):(req===p.s?3:1);mv={a:"place",pid,slot:t.slot,layer:t.layer};}
  if(v>bv){bv=v;best=mv;}}return best;}
function botStep(g,seat){
 if(g.phase==="take"){const o=botOrder(g,seat);if(o)return o;let m=botTake(g,seat);
  if(m.a==="work"&&!g.mdisc&&g.market.length&&Math.random()<0.3){const P=g.pl[seat];let w=g.market[0],wv=99;for(const id of g.market){const v=useVal(g,P,id,P.st);if(v<wv){wv=v;w=id;}}return {a:"mdisc",pid:w};}
  if(m.a==="work"&&free(g,seat)<2){const P=g.pl[seat];const junk=P.st.find(id=>useVal(g,P,id,[])<0);if(junk!=null)return {a:"sdisc",pid:junk};}return m;}
 const m=g.placed<2?botPlace(g,seat):null;if(m)return m;const P=g.pl[seat];
 if(P.st.length>=STMAX){const c={};P.st.forEach(id=>c[PT(id).t]=(c[PT(id).t]||0)+1);const top=Object.keys(c).sort((x,y)=>c[y]-c[x])[0];let junk=P.st.find(id=>useVal(g,P,id,[])<0);if(junk==null&&c[top]>=2)junk=P.st.filter(id=>PT(id).t===top).pop();if(junk!=null)return {a:"sdisc",pid:junk};}
 return {a:"end"};}

/* ---- мережа: WebSocket-сервер кімнат ---- */
const PID=null;
function wsURL(){return (location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws";}
function openWS(onmsg){return new Promise((res,rej)=>{let ws;try{ws=new WebSocket(wsURL());}catch(e){return rej(e);}
 const t=setTimeout(()=>{try{ws.close();}catch(_){}rej(new Error("timeout"));},15000);
 ws.onopen=()=>{clearTimeout(t);res(ws);};ws.onerror=()=>{clearTimeout(t);rej(new Error("ws"));};
 ws.onmessage=e=>{let d;try{d=JSON.parse(e.data);}catch(_){return;}onmsg(d);};});}
function wsSend(m){try{if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(m));return NET.ws&&NET.ws.readyState===1;}catch(e){return false;}}
function bcast(){if(NET.role!=="host")return;wsSend({t:"state",data:G?{g:pack(G)}:{lobby:NET.lobby}});}
function netSend(m){return wsSend({t:"move",m});}
async function hostRoom(){let codeP;const got=new Promise(r=>codeP=r);

  if(d.t==="hosted"){codeP(d.code);return;}
  if(d.t==="hello"){const name=clean(d.name)||"Гість";const seats=G?G.seats:NET.lobby;if(!seats)return;if(!seats.some(s=>s.peer===d.from)){const live=new Set(NET.live||[]);
    let i=seats.findIndex(s=>s.k==="net"&&!s.peer);if(i<0)i=seats.findIndex(s=>s.k==="net"&&s.n===name&&!live.has(s.peer));if(i<0)i=seats.findIndex(s=>s.k==="net"&&!live.has(s.peer));
    if(i>=0){seats[i].peer=d.from;seats[i].n=name;save();}else wsSend({t:"to",to:d.from,data:{t:"full"}});}
   NET.live=(NET.live||[]).concat(d.from);if(G)render();else lobbyRender();bcast();return;}
  if(d.t==="left"){NET.live=(NET.live||[]).filter(x=>x!==d.from);if(!G)lobbyRender();return;}
  if(d.t==="move"&&G){const seat=G.seats.findIndex(s=>s.k==="net"&&s.peer===d.from);const m=d.m;if(seat<0||seat!==G.cur||!m||typeof m!=="object")return;
   doMove(seat,{a:String(m.a),pid:+m.pid,mode:m.mode,slot:+m.slot,layer:m.layer==null?null:+m.layer,o:m.o==null?null:+m.o});}});}
 catch(e){toast("Не вдалося з’єднатися із сервером гри. Якщо сервер щойно прокинувся — спробуйте ще раз за хвилину.",1);return false;}
 NET.ws.onclose=()=>{if(NET.role==="host")toast("З’єднання із сервером втрачено",1);};
 wsSend({t:"host"});NET.code=await Promise.race([got,new Promise(r=>setTimeout(()=>r(null),10000))]);if(!NET.code){toast("Сервер не відповів",1);return false;}
 NET.role="host";try{location.hash="g-"+NET.code;}catch(e){}NET.timer=setInterval(bcast,5000);return true;}

 try{NET.ws=await openWS(d=>{
  if(d.t==="joined"){NET.myPeer=d.id;return;}
  if(d.t==="nf"){toast("Кімнату "+code.toUpperCase()+" не знайдено. Перевірте код і чи відкрита гра в господаря.",1);leave();return;}

 h+=`<section class="panel"><div class="ptitle">${hosting?"Кімната відкрита":"Нова гра"}</div>`;
 if(hosting)h+=`<div class="lrow"><span class="code">${esc(NET.code.toUpperCase())}</span><button class="ibtn" onclick="copyCode()" title="Скопіювати код">${ic("copy")}</button></div><p class="waitb">Надішліть код друзям: вони відкривають цю ж сторінку гри й вводять його в «Приєднатися». Не закривайте цю вкладку до кінця гри.</p>`;
 seats.forEach((s,i)=>{h+=`<div class="lrow">${seatAva(s,i)}`+(hosting?`<span class="sn" style="flex:1">${esc(s.n)}${s.k==="net"?(s.peer?" ✓":" · чекаємо…"):""}</span>`:`<input class="inp" id="nm${i}" maxlength="16" value="${esc(s.n)}" oninput="SETUP.seats[${i}].n=this.value"><div class="kind">${["local","bot","net"].map(k=>`<button class="${s.k===k?"on":""}" onclick="SETUP.seats[${i}].k='${k}';lobbyRender()" title="${{local:"Гравець за цим екраном",bot:"Бот",net:"Онлайн-гравець"}[k]}">${ic({local:"user",bot:"bot",net:"net"}[k])}</button>`).join("")}</div>`)+(hosting&&s.k==="local"?`<span class="waitb">ви</span>`:"")+`</div>`;});
 if(!hosting)h+=`<div class="lrow"><button class="ibtn" onclick="if(SETUP.seats.length<4){SETUP.seats.push({n:'Бот '+(SETUP.seats.length+1),k:'bot'});lobbyRender()}" title="Додати гравця">${ic("plus")}</button><button class="ibtn" onclick="if(SETUP.seats.length>1){SETUP.seats.pop();lobbyRender()}" title="Прибрати гравця">${ic("minus")}</button><span class="waitb">${ic("user")} за цим екраном · ${ic("bot")} бот · ${ic("net")} онлайн</span></div>`;
 h+=`<div class="sline"><button class="btn" onclick="startGame()">${ic("end")}${hosting?"Почати гру":"Почати"}</button>${sv&&!sv.over&&!hosting?`<button class="btn alt" onclick="resume()">Продовжити збережену</button>`:""}</div>`;
 
 h+=`</section><section class="panel"><div class="ptitle">${ic("net")} Приєднатися</div><div class="lrow"><input class="inp" id="jc" placeholder="Код" maxlength="6" value="${hash?esc(hash[1].toUpperCase()):""}" style="text-transform:uppercase;letter-spacing:3px"></div><div class="lrow"><input class="inp" id="jn" placeholder="Ваше ім’я" maxlength="16"></div><button class="btn" onclick="joinRoom(document.getElementById('jc').value,document.getElementById('jn').value)">Увійти</button><p class="waitb">Попросіть господаря створити кімнату й надіслати вам код. Господар має тримати гру відкритою до кінця партії.</p></section></div></div>`;
 app.innerHTML=h;}
function copyCode(){try{navigator.clipboard.writeText(NET.code.toUpperCase()).then(()=>toast("Код скопійовано"),()=>toast(NET.code.toUpperCase()));}catch(e){toast(NET.code.toUpperCase());}}
async function startGame(){if(NET.role==="host"){beginGame(NET.lobby.map(s=>s.k==="net"&&!s.peer?{n:"Бот "+s.n,k:"bot"}:s));return;}
 const seats=SETUP.seats.map((s,i)=>({n:clean(s.n)||"Гравець "+(i+1),k:s.k}));
 if(seats.some(s=>s.k==="net")&&!seats.some(s=>s.k==="local")){modal(`<h2>Де ваше місце?</h2><p>Усі живі гравці позначені як ${ic("net")} онлайн. Тоді друзі займуть ці місця, а вам за цим екраном не лишиться жодного.</p><p>Позначте <b>своє</b> місце як ${ic("user")} «за цим екраном», а місця друзів — ${ic("net")}.</p>`,[["Зрозуміло",null]]);return;}
 if(seats.some(s=>s.k==="net")){if(await hostRoom()){NET.lobby=seats.map(s=>({...s,peer:null}));lobbyRender();bcast();return;}seats.forEach(s=>{if(s.k==="net")s.k="bot";});}
 beginGame(seats);}
function beginGame(seats){G=mkGame(seats.map(s=>({n:s.n,k:s.k,peer:s.peer||null})));VIEW=0;save();render();bcast();if(G.seats[0].k==="local"&&G.seats.filter(s=>s.k==="local").length>1)passScreen();schedule();}
function resume(){G=load();if(!G)return;G.seats.forEach(s=>{if(s.k==="net")s.k="bot";});VIEW=G.cur;render();schedule();}
function guestWait(){if(G)return render();document.body.classList.remove('ingame');const ls=NET.lobby||[];app.innerHTML=`<div class="bar"><div class="logo">Брами та дворики</div></div><div class="lobby">${heroHTML()}<section class="panel"><div class="ptitle">${ic("net")} Кімната ${esc(NET.code.toUpperCase())}</div>${ls.length?ls.map((s,i)=>`<div class="lrow">${seatAva(s,i)}<span class="sn">${esc(s.n)}${s.peer&&s.peer===NET.myPeer?" — ви":""}</span></div>`).join(""):`<p class="waitb">Під’єднуємося до господаря кімнати…</p>`}<p class="waitb">Гра почнеться, коли господар натисне «Почати гру».</p><button class="btn alt" onclick="leave()">Вийти</button></section></div>`;}

lobbyRender();
</script>
</body>
</html>
