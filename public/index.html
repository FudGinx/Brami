<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Брами та дворики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: тепла сімейна настільна гра — ранок у старому дворику
   IDEA: стіл реставратора: велика крамниця-полиця, відкриті замовлення, три фасади
   PICTURE: великі двері, що збираються шарами на тлі стін українських міст
   COLOUR and TYPE: каштанова зелень столу, вапняк, латунь; Alegreya + Golos Text
   LAYOUT: смуга гравців; крамниця на всю ширину; альбом з трьома великими стінами; липка панель ходу */
:root{color-scheme:light dark;--table:#1c362f;--paper:#fbf7ee;--ink:#2a241d;--cream:#f3ecdc;--mute:#b9c7bf;--brass:#d6a640;--wood:#6b4a2e;--wood2:#553923;--ok:#5fd08a;--bad:#e0645a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;color:var(--cream);font:15px/1.4 "Golos Text",system-ui,sans-serif;overflow-x:clip}
body{background:radial-gradient(1200px 600px at 20% -10%,#2f5a4e 0,transparent 60%),var(--table);min-height:100vh}
button{font:inherit;color:inherit}
.ic{width:22px;height:22px;flex:none;vertical-align:middle}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(0,0,0,.25);border-bottom:2px solid var(--brass);flex-wrap:wrap}
.logo{font:800 24px/1 Alegreya,Georgia,serif;margin-right:6px;white-space:nowrap}
.seats{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.seat{display:flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:999px;background:rgba(255,255,255,.07);border:2px solid transparent;cursor:pointer;min-height:42px}
.seat.cur{border-color:var(--brass);background:rgba(214,166,64,.16)}
.seat.view{box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.ava{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#1c1c1c;flex:none}.ava .ic{width:18px;height:18px}
.sn{font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-weight:800;color:var(--brass);display:flex;align-items:center;gap:2px}.sc .ic{width:15px;height:15px}
.dd{display:flex;gap:2px}.dd i{width:8px;height:11px;border-radius:4px 4px 0 0;background:rgba(255,255,255,.2)}.dd i.on{background:var(--brass)}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);display:grid;place-items:center;cursor:pointer}
.ibtn:focus-visible,.btn:focus-visible,.card:focus-visible,.ocard:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:14px 14px 0}
.panel{background:rgba(0,0,0,.18);border-radius:20px;padding:14px;margin-bottom:14px}
.ptitle{display:flex;align-items:center;gap:10px;font:800 20px Alegreya,Georgia,serif;margin:0 0 12px;flex-wrap:wrap}
.ptitle .meta{font:600 13px "Golos Text";color:var(--mute);display:flex;gap:12px;margin-left:auto;align-items:center}
.ptitle .meta span{display:flex;align-items:center;gap:4px}.ptitle .meta .ic{width:17px;height:17px}
.shop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:14px}
@media(max-width:1000px){.shop{grid-template-columns:minmax(0,1fr)}}
.shelf{background:linear-gradient(var(--wood),var(--wood2));border-radius:16px;padding:12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;box-shadow:inset 0 -7px 0 rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.3)}
@media(max-width:520px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:8px}}
.card{position:relative;aspect-ratio:3/4.3;background:var(--paper);color:var(--ink);border-radius:11px;box-shadow:0 2px 0 rgba(0,0,0,.25),0 5px 12px rgba(0,0,0,.28);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card .top{position:absolute;left:0;right:0;top:0;height:21px;background:var(--c);color:#fff;display:flex;align-items:center;gap:4px;padding:0 6px;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden}
.card .top .ic{width:14px;height:14px}
.card .part{position:absolute;left:7%;top:23px;width:86%;height:calc(100% - 50px)}
.card .lab{position:absolute;left:0;right:0;bottom:0;height:26px;display:flex;align-items:center;gap:4px;padding:0 6px;font-size:12px;font-weight:700;border-top:1px solid #e6dcc8;white-space:nowrap;overflow:hidden}
.card .lab .ic{width:16px;height:16px}
.card.fit{box-shadow:0 0 0 3px var(--ok),0 5px 12px rgba(0,0,0,.28)}
.card.perfect{box-shadow:0 0 0 4px var(--brass),0 0 18px 4px rgba(214,166,64,.7)}
.card.perfect::after{content:"★";position:absolute;right:5px;top:24px;width:22px;height:22px;border-radius:50%;background:var(--brass);color:#2a241d;display:grid;place-items:center;font-size:13px;font-weight:800}
.card.sel{transform:translateY(-6px)}
.card.will{transform:translateY(-6px) scale(1.04);box-shadow:0 0 0 4px #fff,0 0 20px rgba(255,255,255,.6)}
.card.lift{opacity:.25}.card.off{cursor:default}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(-4deg) scale(1.08);box-shadow:0 16px 30px rgba(0,0,0,.5)!important}
.side{display:flex;flex-direction:column;gap:12px}
.omkt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ocard{background:var(--paper);color:var(--ink);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3);position:relative;touch-action:none}
.ocard .ws{display:block;width:100%;height:auto}
.ocard .on{padding:5px 7px 7px;font-size:12px;font-weight:700;line-height:1.2}
.chips{display:flex;gap:2px;margin-top:4px;width:100%}.chips i{flex:1;height:7px;border-radius:2px;display:block}
.ocard.ok{box-shadow:0 0 0 3px var(--brass),0 4px 10px rgba(0,0,0,.3)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:72px;border-radius:14px;border:2px dashed rgba(255,255,255,.28);background:rgba(255,255,255,.05);cursor:pointer;font-weight:700;padding:6px;text-align:center}
.tool b{display:flex;align-items:center;gap:6px;font-size:16px}.tool b .ic{width:26px;height:26px}.tool small{font-weight:400;color:var(--mute);font-size:12px}
.tool[disabled]{opacity:.35;cursor:default}
.tool.ok{border-color:var(--brass);border-style:solid;background:rgba(214,166,64,.15)}.tool.hot{background:rgba(214,166,64,.4)}
.walls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:820px){.walls{grid-template-columns:minmax(0,1fr)}}
.door{display:flex;flex-direction:column;gap:8px}
.wall{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.38);cursor:pointer}
.wall .ws{display:block;width:100%;height:auto}
.wall.ok{outline:4px solid var(--brass);outline-offset:-4px}
.wall.hot{outline-width:7px}
.wall.thump{animation:thump .55s}
@keyframes thump{30%{transform:scale(1.03)}60%{transform:scale(.99)}}
.badge{position:absolute;right:10px;top:10px;background:var(--brass);color:#2a241d;border-radius:999px;padding:4px 11px;font-weight:800;display:flex;align-items:center;gap:3px;font-size:16px}.badge .ic{width:16px;height:16px}
.otitle{font:800 16px/1.15 Alegreya,serif;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.otitle small{font:600 12px "Golos Text";color:var(--mute);white-space:nowrap}
.strip{background:rgba(255,255,255,.06);border-radius:12px;padding:4px}
.lr{display:grid;grid-template-columns:26px minmax(0,1fr) auto 22px;gap:6px;align-items:center;padding:5px 6px;border-radius:8px;font-size:13.5px}
.lr .ic{width:20px;height:20px}
.lr .nm{font-weight:600}
.lr .need{display:flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px 2px 3px;font-size:12px;font-weight:700;color:#fff;background:var(--c);white-space:nowrap}
.lr .need .ic{width:14px;height:14px}
.lr .st{font-weight:800;text-align:center}
.lr.now{background:rgba(214,166,64,.22);box-shadow:inset 3px 0 0 var(--brass)}
.lr.done .nm{opacity:.75}
.lr.ok{outline:2px solid var(--brass)}.lr.hot{background:rgba(214,166,64,.45)}
.st.y{color:var(--ok)}.st.n{color:#f0b35a}
.emptyhint{padding:10px;font-size:14px;color:var(--mute);text-align:center}
.lower{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;margin-top:14px;align-items:start}
@media(max-width:820px){.lower{grid-template-columns:minmax(0,1fr)}}
.tray{position:relative;background:linear-gradient(#e7dcc5,#d8c9ab);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;box-shadow:inset 0 3px 8px rgba(0,0,0,.25)}
@media(max-width:700px){.tray{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cell{aspect-ratio:3/4.3;border-radius:11px;border:2px dashed rgba(90,70,40,.3)}
.dock{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);width:min(920px,94vw);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;z-index:45;animation:dockin .2s}
@keyframes dockin{from{transform:translate(-50%,30px);opacity:0}}
.dock .zone{min-height:118px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.zone{border-radius:14px;background:rgba(28,54,47,.9);border:3px dashed var(--brass);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--cream);text-align:center}
.zone b{display:flex;align-items:center;gap:8px;font:800 26px Alegreya,serif}.zone b .ic{width:30px;height:30px}.zone small{font-size:13px}
.zone.hot{background:rgba(214,166,64,.95);color:#2a241d;border-style:solid}
.zone.full{background:rgba(120,30,25,.9);border-color:var(--bad)}
.handw{display:flex;flex-direction:column;gap:6px}
.handw .lbl{font-size:13px;color:var(--mute);font-weight:600}
.hand{display:flex;gap:8px;min-height:60px;border-radius:12px;padding:4px}
.hand.ok{outline:3px dashed var(--brass)}.hand.hot{background:rgba(214,166,64,.3)}
.hand .ocard{width:118px}
.turn{position:sticky;bottom:0;z-index:6;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:rgba(16,32,28,.96);border-top:2px solid var(--brass);margin:0 -14px;backdrop-filter:blur(6px)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.07);font-weight:700;font-size:14px;opacity:.55}
.step.on{opacity:1;background:rgba(214,166,64,.22);box-shadow:inset 0 0 0 2px var(--brass)}.step.done{opacity:.9}.step .ic{width:18px;height:18px}
.hint{flex:1;font-size:14px;color:var(--mute);min-width:200px}
.hint.warn{color:#ffd6a0;font-weight:600}
.btn{min-height:46px;border-radius:12px;border:0;padding:10px 18px;font-weight:700;background:var(--brass);color:#2a241d;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.alt{background:rgba(255,255,255,.1);color:var(--cream);border:1px solid rgba(255,255,255,.25)}
.btn[disabled]{opacity:.35;cursor:default}
#modal{position:fixed;inset:0;background:rgba(8,14,12,.62);display:flex;align-items:center;justify-content:center;z-index:40;padding:12px}
.mbox{background:var(--paper);color:var(--ink);max-width:600px;width:100%;max-height:92vh;overflow:auto;border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h2{font:800 26px/1.1 Alegreya,Georgia,serif;margin:0 0 10px}
.mbox .btn.alt{color:var(--ink);background:#ece3cf;border-color:#d8cbb0}
.mbox .strip{background:#efe6d2}.mbox .lr{color:var(--ink)}
.hidden{display:none!important}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.choice{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:14px;background:#efe6d2;border:2px solid transparent;cursor:pointer;font-weight:800;font-size:20px;text-align:center}
.choice:hover{border-color:var(--brass)}.choice .ic{width:34px;height:34px}.choice small{font:400 13px "Golos Text";color:#6b5f50}
.choice.dis{opacity:.4;cursor:not-allowed}
.choice .ws{width:120px;border-radius:10px}
.pcin{animation:flip .8s cubic-bezier(.3,.7,.2,1)}@keyframes flip{from{transform:perspective(900px) rotateY(-100deg);opacity:.2}}
.fact{background:#efe4cc;border-radius:12px;padding:10px 12px}
.big .ws{width:240px;max-width:80%;display:block;margin:0 auto 10px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.sline{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sline span{background:#efe4cc;border-radius:999px;padding:4px 10px;font-weight:700;display:flex;gap:4px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:7px 5px;border-bottom:1px solid #e0d4bc;text-align:left}td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.float{position:fixed;z-index:60;pointer-events:none;font:800 26px Alegreya,serif;color:var(--brass);text-shadow:0 2px 6px rgba(0,0,0,.6);animation:up 1.2s forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#14241f;color:#fff;padding:11px 18px;border-radius:14px;z-index:70;font-weight:600;border:1px solid var(--brass);max-width:92vw;text-align:center}
.toast.warn{border-color:var(--bad);background:#3a1714}
.lobby{max-width:1100px;margin:0 auto;padding:16px}
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:8px 0 18px}
.hero .wall{cursor:default}
.lgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media(max-width:760px){.lgrid{grid-template-columns:minmax(0,1fr)}}
.lrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.inp{flex:1;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:var(--cream);font:16px "Golos Text"}
.kind{display:flex;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.kind button{width:46px;height:46px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--mute)}.kind button.on{background:var(--brass);color:#2a241d}
.code{font:800 34px/1 Alegreya,serif;letter-spacing:4px;color:var(--brass)}
.waitb{font-size:13px;color:var(--mute)}
.plq{display:inline-block;background:#24508f;color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;border:1px solid #fff;box-shadow:0 0 0 1px #24508f}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:16px;height:12px;border-radius:3px;display:inline-block}
@media(max-width:600px){.logo{font-size:18px}.sn,.dd{display:none}.seat{padding-right:8px}.wrap{padding:8px 8px 0}.panel{padding:10px}.turn{margin:0 -8px}.hint{min-width:0;flex-basis:100%;order:3}}
@media(min-width:900px) and (min-height:560px){
 body.ingame{height:100vh;overflow:hidden}
 body.ingame #app{height:100vh;display:flex;flex-direction:column}body.ingame .bar{flex:none}body.ingame .seats{flex-wrap:nowrap;overflow:hidden}
 .game{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,37fr) minmax(0,63fr);grid-template-rows:minmax(0,1fr) auto;gap:10px;padding:10px;max-width:none}
 .game>.panel{margin:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:10px}
 .game .ptitle{margin-bottom:8px;font-size:18px}
 .game>.turn{grid-column:1/-1;position:static;margin:0;border-radius:14px;padding:8px 12px}
 .game .shop{grid-template-columns:minmax(0,1fr);gap:10px;min-height:0;flex:1;align-content:start}
 .game .shelf{padding:8px;gap:7px}
 .game .card .top{height:18px;font-size:10.5px}.game .card .part{top:20px;height:calc(100% - 44px)}.game .card .lab{height:23px;font-size:11px}
 .game .legend{margin-top:5px;font-size:11.5px}
 .game .side{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:8px;align-items:start}
 .game .side .ptitle{font-size:14px!important}.game .side .ptitle .meta{font-size:11px}
 .game .omkt{gap:6px}.game .ocard .on{font-size:11px;padding:4px 5px 5px}
 .game .tools{grid-template-columns:1fr;gap:6px;margin-top:22px}
 .game .tool{min-height:0;padding:6px 4px}.game .tool small{font-size:10.5px}.game .tool b .ic{width:22px;height:22px}
 .game .walls{flex:1;min-height:0;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
 .game .door{min-height:0;gap:5px}
 .game .otitle{font-size:14px}
 .game .wall{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;background:none;box-shadow:none;overflow:visible;border-radius:0}
 .game .wall .ws{height:100%;width:auto;max-width:100%;border-radius:14px;box-shadow:0 8px 18px rgba(0,0,0,.38)}
 .game .wall.ok{outline:none}.game .wall.ok .ws{outline:4px solid var(--brass);outline-offset:-4px}.game .wall.hot .ws{outline-width:7px}
 .game .badge{right:auto;left:50%;transform:translateX(-50%);top:6px}
 .game .strip{padding:2px}.game .lr{padding:2px 5px;font-size:12px;gap:5px;grid-template-columns:20px minmax(0,1fr) auto 16px}.game .lr .ic{width:16px;height:16px}.game .lr .need{font-size:11px;padding:1px 7px 1px 2px}.game .lr .need .ic{width:12px;height:12px}
 .game .emptyhint{padding:6px;font-size:12.5px}
 .game .lower{margin-top:8px;gap:10px}
 .game .lower .ptitle{font-size:14px!important;margin-bottom:5px!important}
 .game .tray{padding:6px;gap:6px}
 .game .hand{min-height:0;padding:0;gap:6px}.game .hand .ocard{width:74px}.game .hand .ocard .on{font-size:9.5px;padding:3px 4px 4px}
}
@media(min-width:900px) and (max-height:760px) and (min-height:560px){
 .game .legend{display:none}.game .otitle small{display:none}.game .ptitle .meta{font-size:11px}
 .game .tray{grid-template-columns:repeat(8,minmax(0,62px))}.game .hand .ocard{width:62px}
}
/* замовлення: відкриті — малі зі збільшенням при наведенні, у руці — великі */
.omkt{grid-template-columns:repeat(3,minmax(0,96px))}
.omkt .ocard{transition:transform .18s ease,box-shadow .18s;transform-origin:top center;position:relative}
.omkt .ocard:first-child{transform-origin:top left}.omkt .ocard:last-child{transform-origin:top right}
.omkt .ocard:hover,.omkt .ocard:focus-visible{transform:scale(2);z-index:30;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.hand .ocard{width:140px}
@media(min-width:900px) and (min-height:560px){
 .game>.panel:first-child{overflow:visible;position:relative;z-index:5}
 .game .omkt{grid-template-columns:repeat(3,minmax(0,78px))}
 .game .omkt .ocard:hover,.game .omkt .ocard:focus-visible{transform:scale(2.3)}
 .game .hand .ocard{width:108px}.game .hand .ocard .on{font-size:11.5px;padding:4px 6px 6px}
}
@media(min-width:900px) and (max-height:760px) and (min-height:560px){.game .hand .ocard{width:96px}}
.verd{text-align:center;margin:-4px 0 12px}
.verd b{display:block;font:800 30px/1.1 Alegreya,serif;color:#7a5a12}
.verd.v5 b{color:#b8860b;font-size:36px;text-shadow:0 2px 0 #f3dc9a}
.verd.v4 b{color:#a06a12}.verd.v0 b,.verd.v1 b,.verd.v2 b{color:#6b5f50}
.verd small{display:block;color:#6b5f50;font-size:14px;margin-top:4px}
.vst{display:flex;justify-content:center;gap:4px;margin-bottom:6px}

const domS=d=>{const c={};d.L.forEach(id=>{const s=PT(id).s;c[s]=(c[s]||0)+1;});return Object.keys(c).sort((a,b)=>c[b]-c[a])[0];};
const GOALS=[
 {n:"Шанувальники сецесії",ic:"mod",d:"Найбільше деталей Модерну в завершених дверях: +5",maj:P=>cntS(P,"mod"),v:5},
 {n:"Класична школа",ic:"cls",d:"Найбільше деталей Класицизму в завершених дверях: +5",maj:P=>cntS(P,"cls"),v:5},
 {n:"Бароковий смак",ic:"bar",d:"Найбільше деталей Бароко в завершених дверях: +5",maj:P=>cntS(P,"bar"),v:5},
 {n:"Народні майстри",ic:"nar",d:"Найбільше народних деталей у завершених дверях: +5",maj:P=>cntS(P,"nar"),v:5},
 {n:"Мандрівник",ic:"scroll",d:"Завершені двері з 3 різних міст: +4",f:P=>new Set(finD(P).filter(d=>d.o>=0).map(d=>ORD[d.o].city)).size>=3?4:0},
 {n:"Еклектик",ic:"palette",d:"+3 за кожні завершені двері, де 3 і більше різних стилів",f:P=>finD(P).filter(d=>new Set(d.L.map(id=>PT(id).s)).size>=3).length*3},
 {n:"Пурист",ic:"star",d:"+3 за кожні завершені двері в одному стилі",f:P=>finD(P).filter(d=>new Set(d.L.map(id=>PT(id).s)).size===1).length*3},
 {n:"Перші в місті",ic:"base",d:"Хто першим завершив двері: +3",f:(P,i,g)=>g.first===i?3:0},
 {n:"Охайна майстерня",ic:"tray",d:"Без жодного браку й з порожнім лотком наприкінці: +3",f:P=>!P.brak&&!P.st.length?3:0}];
const GFM=[s=>`${ic(s)}${ic(s)}${ic(s)}<i>найбільше</i>`];
function goalFm(gi){const G2=GOALS[gi];if(gi<4)return GFM[0](G2.ic);return [null,null,null,null,
 `${ic("base")}${ic("base")}${ic("base")}<i>3 міста</i>`,
 `${ic("mod")}${ic("cls")}${ic("bar")}<i>на дверях</i>`,
 `${ic("cls")}${ic("cls")}${ic("cls")}${ic("cls")}${ic("cls")}<i>один стиль</i>`,
 `${ic("base")}<i>№1</i>`,
 `${ic("bin")}<i>0</i>${ic("tray")}<i>0</i>`][gi];}
const GVAL=[5,5,5,5,4,3,3,3,3],GEACH=[0,0,0,0,0,1,1,0,0];
function goalCards(){if(!G||!G.goals)return "";return `<div class="gcards">${G.goals.map(gi=>{const G2=GOALS[gi],who=G.seats.map((s,i)=>goalPts(G,gi,i)?seatAva(s,i):"").join("");
 return `<div class="gcard" tabindex="0" onclick="goalsModal()" title="${G2.n}: ${G2.d}"><span class="gic">${ic(G2.ic)}</span><span class="gtx"><b>${G2.n}</b><span class="gfm">${goalFm(gi)}</span></span><span class="gv">+${GVAL[gi]}${GEACH[gi]?"<small>кожні</small>":""}</span>${who?`<span class="gwho" title="Зараз отримали б">${who}</span>`:""}<span class="gtip">${G2.d}</span></div>`;}).join("")}</div>`;}
function goalPts(g,gi,i){const G2=GOALS[gi],P=g.pl[i];if(G2.f)return G2.f(P,i,g);const vals=g.pl.map(G2.maj),mx=Math.max(...vals);return mx>0&&G2.maj(P)===mx?G2.v:0;}
function ensemble(P){let e=0;for(const [a,b] of [[0,1],[1,2]]){const A=P.doors[a],B=P.doors[b];if(isDone(A)&&isDone(B)&&domS(A)===domS(B))e+=2;}return e;}
function extras(g,i){const gl=(g.goals||[]).reduce((a,gi)=>a+goalPts(g,gi,i),0),en=ensemble(g.pl[i]);return {gl,en,tot:gl+en};}
function goalsBar(){if(!G||!G.goals)return "";return `<div class="goalbar" onclick="goalsModal()" title="Спільні цілі партії">${G.goals.map(gi=>`<span class="gchip" title="${GOALS[gi].n}: ${GOALS[gi].d}">${ic(GOALS[gi].ic)}${GOALS[gi].n}</span>`).join("")}</div>`;}
function goalsModal(){const rows=G.goals.map(gi=>`<div class="grow"><b>${ic(GOALS[gi].ic)} ${GOALS[gi].n}</b><small>${GOALS[gi].d}</small><div class="gnow">${G.seats.map((s,i)=>`<span>${seatAva(s,i)} ${goalPts(G,gi,i)?"+"+goalPts(G,gi,i):"0"}</span>`).join("")}</div></div>`).join("");
 modal(`<h2>Цілі партії</h2><p class="waitb" style="color:#6b5f50">Очки за цілі й ансамбль нараховуються в кінці гри. Нижче — скільки кожен отримав би зараз.</p>${rows}<div class="grow"><b>${ic("base")} Ансамбль дворика</b><small>+2 за кожну пару сусідніх завершених дверей з однаковим переважаючим стилем (місця 1–2 і 2–3).</small><div class="gnow">${G.seats.map((s,i)=>`<span>${seatAva(s,i)} ${ensemble(G.pl[i])?"+"+ensemble(G.pl[i]):"0"}</span>`).join("")}</div></div>`,[["Зрозуміло",null]]);}
/* ================= БОТ ================= */
function useVal(g,P,id,have){const p=PT(id);let best=-1.0;
 P.doors.forEach(d=>{if(!d){if(p.t==="base"){const ok=P.hand.some(o=>ORD[o].req[0]===p.s),al=have.some(h=>PT(h).t==="base");best=Math.max(best,al?0.1:(ok?3:1.6));}return;}if(isDone(d))return;const n=nextIdx(d);
  for(let k=n;k<5;k++){if(!ACC[k].includes(p.t))continue;const req=reqOf(d,k);const al=have.some(h=>{const q=PT(h);return ACC[k].includes(q.t)&&(!req||q.s===req);});let v=req===p.s?3:1;if(k>n)v*=.8;if(al)v=v*.15-.3;best=Math.max(best,v);}
  for(let k=0;k<n;k++)if(ACC[k].includes(p.t)&&d.o>=0&&PT(d.L[k]).s!==ORD[d.o].req[k]&&p.s===ORD[d.o].req[k])best=Math.max(best,1.5);});if(best>0&&g.goals){const si=["mod","cls","bar","nar"].indexOf(p.s);if(g.goals.includes(si))best+=.4;if(g.goals.includes(6)&&P.doors.some(d=>d&&!isDone(d)&&d.L[0]!=null&&PT(d.L[0]).s===p.s))best+=.3;}return best;}
function botOrder(g,seat){const P=g.pl[seat];if(g.otook||P.hand.length>=2||!g.om.length)return null;const empty=P.doors.some(d=>!d);if(!empty)return null;
 let best=g.om[0],bv=-1;for(const o of g.om){let v=0;ORD[o].req.forEach((s,k)=>{if(P.st.some(id=>PT(id).s===s&&ACC[k].includes(PT(id).t)))v++;});if(v>bv){bv=v;best=o;}}return {a:"order",o:best};}
function botTake(g,seat){const P=g.pl[seat];let best={a:"work"},bv=0.9;const seen=new Set(),fr=free(g,seat);
 for(const pid of g.market)for(const mode of ["s","t"]){const p=PT(pid),key=mode+(mode==="s"?p.s:p.t);if(seen.has(key))continue;seen.add(key);
  const ids=takeSet(g,pid,mode);if(ids.length>fr)continue;let v=0;const tmp=P.st.slice();ids.forEach(id=>{v+=useVal(g,P,id,tmp);tmp.push(id);});if(v>bv){bv=v;best={a:"take",pid,mode};}}
 return best;}
function botPlace(g,seat){const P=g.pl[seat];let best=null,bv=0;
 for(const pid of P.st)for(const t of targets(g,seat,pid)){const d=P.doors[t.slot],p=PT(pid);let v,mv;
  if(!d){const o=P.hand.find(o=>ORD[o].req[0]===p.s);v=o!=null?3:1.2;mv={a:"place",pid,slot:t.slot,o:o!=null?o:P.hand[0]};}
  else{const req=reqOf(d,t.layer);v=t.rep?((req&&PT(d.L[t.layer]).s!==req&&p.s===req)?2.5:-1):(req===p.s?3:1);mv={a:"place",pid,slot:t.slot,layer:t.layer};}
  if(v>bv){bv=v;best=mv;}}return best;}
function botStep(g,seat){
 if(g.phase==="take"){const o=botOrder(g,seat);if(o)return o;let m=botTake(g,seat);
  if(m.a==="work"&&!g.mdisc&&g.market.length&&Math.random()<0.3){const P=g.pl[seat];let w=g.market[0],wv=99;for(const id of g.market){const v=useVal(g,P,id,P.st);if(v<wv){wv=v;w=id;}}return {a:"mdisc",pid:w};}
  if(m.a==="work"&&free(g,seat)<2){const P=g.pl[seat];const junk=P.st.find(id=>useVal(g,P,id,[])<0);if(junk!=null)return {a:"sdisc",pid:junk};}return m;}
 const m=g.placed<2?botPlace(g,seat):null;if(m)return m;const P=g.pl[seat];
 if(P.st.length>=STMAX){const c={};P.st.forEach(id=>c[PT(id).t]=(c[PT(id).t]||0)+1);const top=Object.keys(c).sort((x,y)=>c[y]-c[x])[0];let junk=P.st.find(id=>useVal(g,P,id,[])<0);if(junk==null&&c[top]>=2)junk=P.st.filter(id=>PT(id).t===top).pop();if(junk!=null)return {a:"sdisc",pid:junk};}
 return {a:"end"};}

/* ================= СТАН / МЕРЕЖА ================= */
let G=null,VIEW=0,SELP=null,BOTT=null,MB=[],PICK=null;
let NET={role:null,r:null,code:"",myPeer:null,peers:[],lobby:null,hostPeer:null,timer:null};
let SETUP={seats:[{n:"Оксана",k:"local"},{n:"Бот Тарас",k:"bot"}]};
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=s=>String(s||"").replace(/[\x00-\x1f\x7f]/g,"").trim().slice(0,16);
function save(){if(NET.role==="guest")return;try{localStorage.setItem("brami3",JSON.stringify(G));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem("brami3"));}catch(e){return null;}}
function toast(t,warn){if(warn)play("warn");const el=document.createElement("div");el.className="toast"+(warn?" warn":"");el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),warn?3600:2200);}
function floatAt(el,txt){if(!el)return;const r=el.getBoundingClientRect(),f=document.createElement("div");f.className="float";f.textContent=txt;f.style.left=(r.left+r.width/2-20)+"px";f.style.top=(r.top+r.height/3)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),1300);}
const mySeat=()=>G?G.seats.findIndex(s=>s.k==="net"&&s.peer&&s.peer===NET.myPeer):-1;
const mine=()=>NET.role==="guest"?G&&G.cur===mySeat():G&&G.seats[G.cur].k==="local";
const canAct=()=>G&&!G.over&&mine();
function pack(g){return Object.assign({},g,{deck:cnt(g.deck),disc:cnt(g.disc),od:cnt(g.od)});}
function act(m){if(!canAct())return;if(m.a==="take"&&takeSet(G,m.pid,m.mode).length>free(G,G.cur)){warnFull(takeSet(G,m.pid,m.mode).length);return;}
 if(NET.role==="guest"){if(!netSend(m))toast("Немає зв’язку з господарем",1);return;}doMove(G.cur,m);}
function warnFull(n){toast(`Не влізе: береш ${n}, а в лотку вільно ${free(G,G.cur)}. Скиньте зайве з лотка (−1★ за кожну) або оберіть інший набір чи підробіток.`,1);}
function doMove(seat,m){if(!apply(G,seat,m))return false;G.seq++;SELP=null;save();const fx=G.fx;if(fx&&fx.k==="turn")VIEW=G.cur;render();afterFx(fx);bcast();schedule();return true;}
function afterFx(fx){scoreBumps();if(!fx)return;if(fx.k==="turn"&&TUT.step===3)TUT.step=4;
 if(fx.k==="take")play("take");if(fx.k==="work")play("star");if(fx.k==="mdisc"||fx.k==="sdisc")setTimeout(()=>play("bin"),350);
 if(fx.k==="place"){setTimeout(()=>play("place"),380);if(fx.done){const dd=G.pl[fx.seat].doors[fx.slot];setTimeout(()=>play(dd&&matches(dd)===5?"perfect":"done"),650);}}
 if(fx.k==="turn")setTimeout(()=>play("turn"),250);if(fx.k==="over")setTimeout(()=>play("fanfare"),300);
 if(fx.k==="take"){const t=document.getElementById("tray");if(t){const [x,y]=center(t);setTimeout(()=>stars(x,y,18),450);}}
 if(fx.k==="work"){const [x,y]=center(document.getElementById("work"));stars(x,y,22);}
 if(fx.k==="mdisc"||fx.k==="sdisc"){const [x,y]=center(document.getElementById("bin"));setTimeout(()=>puff(x,y),450);}
 if(fx.k==="place"){const w=document.querySelector(`.wall[data-slot="${fx.slot}"]`);if(w){const [x,y]=center(w);setTimeout(()=>{puff(x,y+60);if(fx.done){const d=G.pl[fx.seat].doors[fx.slot];doorWow(fx.slot,d&&matches(d)===5);}},420);}}
 if(fx.k==="turn")setTimeout(turnBanner,250);
 if(fx.k==="over")setTimeout(()=>fireworks(4),300);
 if(fx.rs)toast("Колода скінчилась — скинуті деталі перемішано назад");
 if(fx.k==="work")floatAt(document.getElementById("work"),"+1★");
 if(fx.k==="sdisc")floatAt(document.getElementById("bin"),"−1★");
 if(fx.k==="place"){const w=document.querySelector(`.wall[data-slot="${fx.slot}"]`);if(w){w.classList.remove("thump");void w.offsetWidth;w.classList.add("thump");}
  if(fx.done){floatAt(w,"+"+fx.pts+"★");const ctrl=G.seats[fx.seat].k==="local"||(NET.role==="guest"&&fx.seat===mySeat());if(ctrl)setTimeout(()=>postcard(fx.seat,fx.slot),550);else{const dd=G.pl[fx.seat].doors[fx.slot];toast(G.seats[fx.seat].n+" завершує двері: "+(dd&&dd.o>=0?VERD[matches(dd)][0]+" ":"")+"+"+fx.pts+"★");}}}
 if(fx.k==="turn"){const s=G.seats[G.cur];if(s.k==="local"&&G.seats.filter(x=>x.k==="local").length>1)passScreen();}
 if(fx.k==="over")setTimeout(finalScreen,600);}
function schedule(){clearTimeout(BOTT);if(!G||G.over||NET.role==="guest")return;if(G.seats[G.cur].k!=="bot")return;
 BOTT=setTimeout(()=>{if(!G||G.over||G.seats[G.cur].k!=="bot")return;const seat=G.cur;const m=botStep(G,seat);if(!doMove(seat,m))doMove(seat,{a:"end"});},G.phase==="take"?950:800);}

/* ---- мережа: WebSocket-сервер кімнат (з перепідключенням) ---- */
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function myTok(){try{let t=localStorage.getItem("brami-tok");if(!t){t=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("brami-tok",t);}return t;}catch(e){return NET.tmpTok||(NET.tmpTok=Math.random().toString(36).slice(2)+Date.now().toString(36));}}
function wsURL(){return (location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws";}
function netBanner(txt){let b=document.getElementById("netban");if(!txt){if(b)b.remove();return;}if(!b){b=document.createElement("div");b.id="netban";b.className="netban";document.body.appendChild(b);}b.textContent=txt;}
function connect(){return new Promise((res,rej)=>{let ws,done=false;try{ws=new WebSocket(wsURL());}catch(e){return rej(e);}
 const t=setTimeout(()=>{if(!done){done=true;try{ws.close();}catch(_){}rej(new Error("timeout"));}},20000);
 ws.onopen=()=>{clearTimeout(t);done=true;NET.ws=ws;NET.retry=0;netBanner(null);res(ws);};
 ws.onclose=()=>{clearTimeout(t);if(!done){done=true;rej(new Error("closed"));}if(NET.ws===ws)NET.ws=null;if(NET.role&&!NET.leaving&&NET.ws==null)reconnectLater();};
 ws.onmessage=e=>{let d;try{d=JSON.parse(e.data);}catch(_){return;}onNet(d);};});}
function reconnectLater(){if(NET.rt||!NET.role)return;const ms=Math.min(15000,1000*Math.pow(2,NET.retry||0));NET.retry=(NET.retry||0)+1;netBanner("Зв’язок перервано — перепідключаємося…");
 NET.rt=setTimeout(async()=>{NET.rt=null;if(!NET.role)return;try{await connect();hello();}catch(e){reconnectLater();}},ms);}
function hello(){if(NET.role==="host")wsSend({t:"host",code:NET.code||null,tok:myTok()});else if(NET.role==="guest")wsSend({t:"join",code:NET.code,name:NET.name,tok:myTok()});}
function wsSend(m){try{if(NET.ws&&NET.ws.readyState===1){NET.ws.send(JSON.stringify(m));return true;}}catch(e){}return false;}
function bcast(){if(NET.role!=="host")return;if(!G)lsSet("brami-lobby",NET.lobby);wsSend({t:"state",data:G?{g:pack(G)}:{lobby:NET.lobby},full:G||null});}
function netSend(m){return wsSend({t:"move",m});}
function seatGuest(from,name){const seats=G?G.seats:NET.lobby;if(!seats)return;name=clean(name)||"Гість";
 if(!seats.some(s=>s.peer===from)){const live=new Set(NET.live||[]);let i=seats.findIndex(s=>s.k==="net"&&!s.peer);if(i<0)i=seats.findIndex(s=>s.k==="net"&&s.n===name&&!live.has(s.peer));if(i<0)i=seats.findIndex(s=>s.k==="net"&&!live.has(s.peer));
  if(i>=0){seats[i].peer=from;seats[i].n=name;save();}else wsSend({t:"to",to:from,data:{t:"full"}});}
 NET.live=[...new Set((NET.live||[]).concat(from))];}
function onNet(d){
 if(NET.role==="host"){
  if(d.t==="hosted"){NET.code=d.code;lsSet("brami-host",{code:d.code});try{location.hash="g-"+d.code;}catch(e){}
   if(d.resume){if(!G&&d.full&&!d.full.over){G=d.full;VIEW=G.cur;}if(!G&&!NET.lobby&&d.lobby)NET.lobby=d.lobby;}
   if(NET.codeP){NET.codeP(d.code);NET.codeP=null;}if(G){render();schedule();}else if(NET.lobby)lobbyRender();bcast();return;}
  if(d.t==="hello"){seatGuest(d.from,d.name);if(G)render();else lobbyRender();bcast();return;}
  if(d.t==="left"){NET.live=(NET.live||[]).filter(x=>x!==d.from);if(!G)lobbyRender();return;}
  if(d.t==="move"&&G){const seat=G.seats.findIndex(s=>s.k==="net"&&s.peer===d.from);const m=d.m;if(seat<0||seat!==G.cur||!m||typeof m!=="object")return;
   doMove(seat,{a:String(m.a),pid:+m.pid,mode:m.mode,slot:+m.slot,layer:m.layer==null?null:+m.layer,o:m.o==null?null:+m.o});}
  return;}
 if(NET.role==="guest"){
  if(d.t==="joined"){NET.myPeer=d.id;lsSet("brami-guest",{code:NET.code,name:NET.name});try{location.hash="g-"+NET.code;}catch(e){}return;}
  if(d.t==="nf"){toast("Кімнату "+NET.code.toUpperCase()+" не знайдено. Перевірте код і чи відкрита гра в господаря.",1);lsSet("brami-guest",null);leave();return;}
  if(d.t==="hostaway"){netBanner("Господар перепідключається… Гра продовжиться, щойно він повернеться.");return;}
  if(d.t==="hostback"){netBanner(null);return;}
  if(d.t==="hostgone"){netBanner(null);toast("Господар закрив кімнату",1);lsSet("brami-guest",null);return;}
  if(d.t==="full"){toast("У кімнаті немає вільних онлайн-місць",1);return;}
  if(d.t==="state"&&d.data){if(d.data.g){const prev=G?G.seq:-1,wasOver=G&&G.over;G=d.data.g;if(wasOver&&!G.over){mclose(-1);toast("Нова партія з тими ж гравцями!");}if(G.seq!==prev){const fx=G.fx;if(fx&&fx.k==="turn")VIEW=G.cur;render();if(prev>=0)afterFx(fx);}}else if(d.data.lobby){NET.lobby=d.data.lobby;guestWait();}}}}
async function hostRoom(){NET.role="host";NET.code=null;NET.leaving=false;const got=new Promise(r=>NET.codeP=r);
 try{await connect();}catch(e){NET.role=null;toast("Не вдалося з’єднатися із сервером гри. Якщо сервер щойно прокинувся — спробуйте ще раз за хвилину.",1);return false;}
 hello();const code=await Promise.race([got,new Promise(r=>setTimeout(()=>r(null),10000))]);if(!code){toast("Сервер не відповів",1);NET.role=null;return false;}
 clearInterval(NET.timer);NET.timer=setInterval(bcast,5000);return true;}
async function resumeHost(code){NET.role="host";NET.code=code;NET.leaving=false;const loc=load();if(loc&&!loc.over)G=loc;if(!G)NET.lobby=lsGet("brami-lobby");
 if(G){VIEW=G.cur;render();}else lobbyRender();try{await connect();hello();}catch(e){reconnectLater();}clearInterval(NET.timer);NET.timer=setInterval(bcast,5000);if(G)schedule();}
async function joinRoom(code,name){code=String(code).toLowerCase().replace(/[^a-z0-9]/g,"");if(code.length<4)return toast("Введіть код кімнати",1);
 NET.role="guest";NET.code=code;NET.name=clean(name)||"Гість";NET.myPeer=myTok();NET.leaving=false;G=null;guestWait();
 try{await connect();}catch(e){toast("Не вдалося з’єднатися із сервером гри. Якщо сервер щойно прокинувся — спробуйте ще раз за хвилину.",1);NET.role=null;lobbyRender();return;}

function tone(f,dur,o){const c=actx();if(!c)return;o=o||{};const t=c.currentTime+(o.at||0),g=c.createGain(),s=c.createOscillator();s.type=o.type||"sine";s.frequency.setValueAtTime(f,t);if(o.to)s.frequency.exponentialRampToValueAtTime(o.to,t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.vol||.3,t+(o.att||.005));g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(g);g.connect(SND.master);s.start(t);s.stop(t+dur+.05);}
function noise(dur,o){const c=actx();if(!c)return;o=o||{};const t=c.currentTime+(o.at||0),n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=o.ftype||"bandpass";f.frequency.setValueAtTime(o.f||1200,t);if(o.fto)f.frequency.exponentialRampToValueAtTime(o.fto,t+dur);f.Q.value=o.q||1;
 const g=c.createGain();g.gain.setValueAtTime(o.vol||.25,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(SND.master);s.start(t);s.stop(t+dur+.02);}
const sfx={
 pick(){noise(.04,{f:2500,q:2,vol:.18});},
 take(){noise(.18,{f:900,fto:3500,q:.8,vol:.16});noise(.12,{f:1500,fto:4000,q:.8,vol:.12,at:.08});},
 place(){tone(140,.12,{type:"triangle",vol:.45});noise(.06,{f:600,q:1.5,vol:.3});tone(118,.1,{type:"triangle",vol:.3,at:.11});noise(.05,{f:500,q:1.5,vol:.2,at:.11});},
 star(){tone(1046,.35,{type:"triangle",vol:.16});tone(1568,.45,{type:"sine",vol:.1,at:.06});},
 bin(){tone(90,.18,{type:"sine",vol:.35,to:60});noise(.2,{f:700,fto:300,q:.7,vol:.18});},
 done(){[523,659,784,1046].forEach((f,i)=>tone(f,.6,{type:"triangle",vol:.17,at:i*.09}));tone(2093,1,{type:"sine",vol:.05,at:.36});},
 perfect(){[523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,.9,{type:"triangle",vol:.17,at:i*.08}));[1046,1318,1568].forEach(f=>tone(f,1.6,{type:"sine",vol:.07,at:.55}));},
 turn(){tone(988,.7,{type:"sine",vol:.13});tone(1976,.5,{type:"sine",vol:.04});},
 pop(){noise(.35,{ftype:"lowpass",f:2500,fto:200,q:.5,vol:.22});tone(80,.25,{vol:.2,to:40});},
 warn(){tone(330,.15,{type:"square",vol:.06});tone(262,.2,{type:"square",vol:.06,at:.14});},
 fanfare(){[392,523,659,784,1046].forEach((f,i)=>tone(f,.7,{type:"sawtooth",vol:.06,at:i*.13}));[523,659,784].forEach(f=>tone(f,1.8,{type:"triangle",vol:.12,at:.7}));}};
function play(n){try{if(SND.mode!=="off"&&sfx[n])sfx[n]();}catch(e){}}
function birds(){clearTimeout(SND.bird);if(SND.mode!=="all")return;SND.bird=setTimeout(()=>{if(SND.mode==="all"&&SND.ctx&&document.visibilityState==="visible"){const b=2200+Math.random()*1800,k=2+Math.floor(Math.random()*3);for(let i=0;i<k;i++)tone(b*(1+Math.random()*.15),.09,{vol:.025,to:b*1.4,at:i*.12});}birds();},5000+Math.random()*9000);}
function sndCycle(){SND.mode=SND.mode==="all"?"sfx":SND.mode==="sfx"?"off":"all";try{localStorage.setItem("brami-snd",SND.mode);}catch(e){}if(SND.mode!=="off"){actx();play("star");}birds();const b=document.getElementById("sndbtn");if(b)b.outerHTML=sndBtn();toast(SND.mode==="all"?"Звук: усе":SND.mode==="sfx"?"Звук: лише ефекти":"Звук вимкнено");}
function sndBtn(){const ic2={all:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14"/>',sfx:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8a5 5 0 0 1 0 8"/>',off:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/>'}[SND.mode];
 return `<button class="ibtn" id="sndbtn" onclick="sndCycle()" title="Звук: ${SND.mode==="all"?"усе":SND.mode==="sfx"?"лише ефекти":"вимкнено"}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ic2}</svg></button>`;}

const TUT={step:(()=>{try{return localStorage.getItem("brami-tut")==="done"?-1:0;}catch(e){return 0;}})(),shownFor:null};
const TSTEPS=[
 {sel:".shelf",t:"Крок 1 — візьміть деталі",b:"Перетягніть картку з крамниці вниз: з’являться зони «увесь колір» і «весь тип». Зелена рамка — деталь підходить вашим дверям, золота ★ — ідеально за типом і кольором.",when:()=>G.phase==="take"},
 {sel:".walls",t:"Крок 2 — поставте на двері",b:"Тягніть деталі з лотка на стіну. Першою завжди йде Основа — тоді оберете замовлення. За хід можна поставити до 2 деталей.",when:()=>G.phase==="place"&&G.placed===0},
 {sel:".door .strip",t:"Шари дверей",b:"Під кожною стіною — 5 шарів по черзі. ◀ показує, що потрібно зараз, колір рамки — потрібний стиль. ✓ — влучили. Перетягніть деталь на вже заповнений шар, щоб замінити.",when:()=>G.phase==="place"&&G.placed>=1,next:true},
 {sel:".turn .btn",t:"Завершіть хід",b:"Коли поставили, що хотіли, — завершуйте хід. Деталі, що лишились у лотку, почекають.",when:()=>G.phase==="place",next:true},
 {sel:".omkt",t:"Замовлення",b:"Раз за хід можна взяти одне з трьох відкритих замовлень у руку (до 3). Наведіть, щоб збільшити. Вгорі — спільні цілі партії: натисніть на них, щоб побачити бонуси.",when:()=>true,next:true}];
function tutEnd(){TUT.step=-1;try{localStorage.setItem("brami-tut","done");}catch(e){}coachHide();}
function tutRestart(){TUT.step=0;try{localStorage.removeItem("brami-tut");}catch(e){}mclose(-1);if(G)coach();toast("Навчання увімкнено");}
function coachHide(){document.querySelectorAll(".coach").forEach(e=>e.remove());document.querySelectorAll(".coach-hl").forEach(e=>e.classList.remove("coach-hl"));}
function tutNext(){TUT.step++;if(TUT.step>=TSTEPS.length)return tutEnd();coachHide();coach();}
function coach(){coachHide();if(TUT.step<0||!G||G.over||!canAct()||VIEW!==G.cur)return;
 if(TUT.step===1&&G.phase==="place"&&G.placed>=1)TUT.step=2;if(TUT.step===0&&G.phase==="place")TUT.step=1;
 const s=TSTEPS[TUT.step];if(!s||!s.when())return;const el=document.querySelector(s.sel);if(!el)return;
 el.classList.add("coach-hl");const r=el.getBoundingClientRect(),b=document.createElement("div");b.className="coach";
 b.innerHTML=`<b>${s.t}</b><p>${s.b}</p><div class="cbtns">${s.next?`<button class="btn" onclick="tutNext()">Далі</button>`:""}<button class="btn alt" onclick="tutEnd()">Пропустити навчання</button><span>${TUT.step+1}/${TSTEPS.length}</span></div>`;document.body.appendChild(b);
 const bw=Math.min(340,innerWidth-20),bh=b.offsetHeight;let x=r.left+r.width/2-bw/2,y=r.bottom+12,up=false;if(y+bh>innerHeight-10){y=r.top-bh-12;up=true;}if(y<10){y=Math.max(10,Math.min(innerHeight-bh-10,r.top+20));}
 x=Math.max(10,Math.min(innerWidth-bw-10,x));Object.assign(b.style,{left:x+"px",top:y+"px",width:bw+"px"});b.classList.add(up?"up":"down");b.style.setProperty("--ax",Math.max(16,Math.min(bw-16,r.left+r.width/2-x))+"px");}
addEventListener("resize",()=>{if(document.querySelector(".coach"))coach();});

/* ================= ВАУ-ЕФЕКТИ ================= */
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const FX={c:document.getElementById("fxc"),p:[],amb:[],run:false};
FX.x=FX.c.getContext("2d");
function fxSize(){const d=devicePixelRatio||1;FX.c.width=innerWidth*d;FX.c.height=innerHeight*d;FX.x.setTransform(d,0,0,d,0,0);}
addEventListener("resize",fxSize);fxSize();
const GOLD=["#ffd27a","#d6a640","#fff3c4","#f2b84b"],CONF=["#4f8a55","#4f709a","#a5413b","#c0832f","#d6a640","#fff3c4"];
function burst(x,y,o){if(RM)return;o=o||{};const n=o.n||30,cols=o.cols||GOLD;for(let i=0;i<n;i++){const a=(o.a0||0)+Math.random()*(o.spread||Math.PI*2),sp=(o.sp||5)*(.4+Math.random());
 FX.p.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up||0),g:o.g==null?.18:o.g,life:1,dec:o.dec||(.012+Math.random()*.012),s:(o.size||5)*(.6+Math.random()*.8),c:cols[Math.floor(Math.random()*cols.length)],k:o.k||"spark",r:Math.random()*6,vr:(Math.random()-.5)*.3});}loop();}
function confetti(x,y,n){burst(x,y,{n:n||90,sp:9,up:6,g:.22,cols:CONF,k:"conf",size:7,dec:.008});}
function puff(x,y){burst(x,y,{n:22,sp:2.2,g:-.02,cols:["#e8dcc4","#cfc2a6","#f4ecdc"],k:"dust",size:9,dec:.02});}
function stars(x,y,n){burst(x,y,{n:n||16,sp:4,up:2,g:.12,cols:GOLD,k:"star",size:7,dec:.016});}
function fireworks(sec){if(RM)return;const end=Date.now()+sec*1000;(function shot(){if(Date.now()>end)return;const x=innerWidth*(.15+Math.random()*.7),y=innerHeight*(.15+Math.random()*.35);
 burst(x,y,{n:70,sp:7,g:.08,cols:Math.random()<.5?GOLD:CONF,dec:.011,size:4});play("pop");setTimeout(shot,260+Math.random()*300);})();}
function drawStar(c,r){c.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}c.closePath();c.fill();}
function loop(){if(FX.run)return;FX.run=true;requestAnimationFrame(step);}
function step(){const c=FX.x;c.clearRect(0,0,innerWidth,innerHeight);
 for(const a of FX.amb){a.t+=.01;a.x+=a.vx+Math.sin(a.t*2)*.3;a.y+=a.vy;a.r+=a.vr;if(a.y>innerHeight+20){a.y=-20;a.x=Math.random()*innerWidth;}c.save();c.globalAlpha=.5;c.translate(a.x,a.y);c.rotate(a.r);c.fillStyle=a.c;c.beginPath();c.ellipse(0,0,a.s,a.s*.45,0,0,Math.PI*2);c.fill();c.restore();}
 FX.p=FX.p.filter(p=>p.life>0);for(const p of FX.p){p.vy+=p.g;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.life-=p.dec;p.r+=p.vr;c.save();c.globalAlpha=Math.max(0,Math.min(1,p.life*1.4));c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;
  if(p.k==="conf")c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else if(p.k==="star")drawStar(c,p.s);else if(p.k==="dust"){c.globalAlpha*=.5;c.beginPath();c.arc(0,0,p.s*(1.6-p.life),0,Math.PI*2);c.fill();}else{c.beginPath();c.arc(0,0,p.s/2,0,Math.PI*2);c.fill();}c.restore();}
 if(FX.p.length||FX.amb.length)requestAnimationFrame(step);else{FX.run=false;c.clearRect(0,0,innerWidth,innerHeight);}}
function ambient(on){if(RM)return;if(!on){FX.amb=[];return;}if(FX.amb.length)return;const cols=["#7aa35c","#9bbf6a","#d9a35a","#f6b8c8"];
 for(let i=0;i<7;i++)FX.amb.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.3,vy:.25+Math.random()*.35,s:5+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.02,t:Math.random()*9,c:cols[i%cols.length]});loop();}
function center(el){if(!el)return [innerWidth/2,innerHeight/2];const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];}

 w.classList.remove("glowdone");void w.offsetWidth;w.classList.add("glowdone");const sw=document.createElement("div");sw.className="sweep";w.appendChild(sw);setTimeout(()=>sw.remove(),1500);
 confetti(x,y-40,perfect?150:80);stars(x,y,perfect?30:14);if(perfect){const f=document.createElement("div");f.className="flash";document.body.appendChild(f);setTimeout(()=>f.remove(),950);setTimeout(()=>fireworks(1.6),300);}}

document.addEventListener("pointermove",e=>{if(DR||RM)return;const c=e.target.closest&&e.target.closest(".card.tilt:not(.off)");document.querySelectorAll(".card.tilting").forEach(x=>{if(x!==c){x.classList.remove("tilting");x.style.transform="";}});if(!c)return;
 const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;c.classList.add("tilting");c.style.transform=`perspective(500px) rotateY(${(px-.5)*16}deg) rotateX(${(.5-py)*16}deg) translateY(-4px) scale(1.04)`;c.style.setProperty("--mx",px*100+"%");c.style.setProperty("--my",py*100+"%");});

function compareTool(){document.body.classList.remove('ingame');const fix=lsGet("brami-cmp")||{};
 const row=o=>{const f=fix[o]||{},req=f.req||ORD[o].req;return `<div class="cmprow" data-o="${o}"><div class="cmph"><b>${o} · ${esc(ORD[o].city)} · ${esc(ORD[o].name)}</b></div><div class="pair"><figure>${protoPic(o)}<figcaption>Листівка-прототип</figcaption></figure><figure class="cmpres">${wallSVG(ORD[o].city,ORD[o].shape,req.map((s,k)=>({t:TYPES[k],s})))}<figcaption>Що збирається з деталей</figcaption></figure></div>
  <div class="cmpsel">${LN.map((n,k)=>`<label>${n}<select onchange="cmpSet(${o},${k},this.value)">${SK.map(s=>`<option value="${s}" ${req[k]===s?"selected":""}>${STY[s].n}</option>`).join("")}</select></label>`).join("")}<label style="flex:1 1 100%">Що не так (для мене)<input value="${esc(f.note||"")}" oninput="cmpNote(${o},this.value)" placeholder="напр. рамка темніша, на листівці немає маскарона…"></label></div></div>`;};
 app.innerHTML=`<section class="panel cmp"><div class="ptitle">Звірка листівок і дверей<span style="margin-left:auto;display:flex;gap:8px"><button class="btn" onclick="cmpExport()">${ic("copy")}Вивантажити JSON</button><button class="btn ghost" onclick="location.hash='';location.reload()">До гри</button></span></div><p class="waitb">Змініть стиль шару — праворуч одразу видно результат. Можна дописати коментар. Потім «Вивантажити JSON» і надішліть файл мені.</p>${ORD.map((_,o)=>row(o)).join("")}</section>`;}
function cmpSet(o,k,s){const fix=lsGet("brami-cmp")||{};const f=fix[o]||(fix[o]={});f.req=(f.req||ORD[o].req.slice());f.req[k]=s;lsSet("brami-cmp",fix);
 const el=document.querySelector(`.cmprow[data-o="${o}"] .cmpres`);el.innerHTML=wallSVG(ORD[o].city,ORD[o].shape,f.req.map((x,i)=>({t:TYPES[i],s:x})))+"<figcaption>Що збирається з деталей</figcaption>";}
function cmpNote(o,v){const fix=lsGet("brami-cmp")||{};(fix[o]||(fix[o]={})).note=v;lsSet("brami-cmp",fix);}
function cmpExport(){const fix=lsGet("brami-cmp")||{};const out=ORD.map((o,i)=>({id:i,city:o.city,name:o.name,card:"/art/cards/card_"+String(i).padStart(2,"0")+".webp",req_now:o.req,req_new:(fix[i]&&fix[i].req)||o.req,changed:!!(fix[i]&&fix[i].req&&fix[i].req.join()!==o.req.join()),note:(fix[i]&&fix[i].note)||""}));
 const b=new Blob([JSON.stringify({game:"brami",layers:LN,styles:SK,orders:out},null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="brami-zvirka.json";document.body.appendChild(a);a.click();a.remove();toast("Файл brami-zvirka.json збережено");}
if(location.hash==="#compare")compareTool();
(function autoResume(){const m=(location.hash||"").match(/^#g-([a-z0-9]{4,6})$/);if(!m)return;const hh=lsGet("brami-host"),gg=lsGet("brami-guest");
 if(hh&&hh.code===m[1])resumeHost(hh.code);else if(gg&&gg.code===m[1])joinRoom(gg.code,gg.name);})();
